<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0a">
<meta name="description" content="《明日方舟》集成战略「沉沦者的黑流树海」自然物增值收益推演计算工具">
<title>军藏思维计算仪 · 黑流树海</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d0a'/%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%238b1a1a'/%3E%3Cpath d='M16 10 21 16 16 22 11 16Z' fill='%23d4a017'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<!-- Supabase 客户端（用于均藏对局收录的跨设备同步） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Chart.js（对局收藏品数量折线图） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ============================================================
   设计变量 —— 修改此处可调整配色与字号
   （字号已按“手机端一页查看”目标压缩；≥1024px 时 +1px）
   ============================================================ */
:root {
  /* 配色 */
  --bg: #0a0d0a;
  --panel: #121812;
  --border: #1a2a1a;
  --border-light: #2a3a2a;
  --text: #c8d4c8;
  --text-dim: #6a7a6a;
  --accent: #8b1a1a;
  --gold: #b8860b;
  --gold-bright: #d4a017;
  --bar-track-bg: #0f150f;
  --row-hover: #161e16;
  --bar-fill: #2a3a2a;

  /* 移动端字号（≥1024px 时整体 +1px，见下方媒体查询） */
  --fs-title: 20px;      /* 页面标题 */
  --fs-sub: 10px;        /* 副标题 */
  --fs-section: 13px;    /* 区块标题 */
  --fs-mat-name: 13px;   /* 自然物名称 */
  --fs-mat-desc: 10px;   /* 自然物说明 */
  --fs-input: 16px;      /* 输入框数字（≥16px 防止 iOS 聚焦缩放） */
  --fs-op-name: 12px;    /* 柱状图作战名 */
  --fs-op-value: 15px;   /* 柱状图数值 */
  --fs-equiv: 10px;      /* 等效收藏品 */
  --fs-shop-label: 12px; /* 商店净增值标签 */
  --fs-shop-value: 15px; /* 商店净增值数值 */

  /* 方舟风斜切角：右上、左下各切 8px */
  --bevel: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  min-height: 100vh;
  /* 潮湿暗黑树海的微弱氛围光 */
  background:
    radial-gradient(900px 520px at 50% -120px, rgba(139, 26, 26, 0.10), transparent 70%),
    radial-gradient(720px 420px at 108% 104%, rgba(26, 58, 26, 0.10), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: 24px;
}

::selection { background: rgba(139, 26, 26, 0.45); }

/* ============================================================
   顶部标题区（压缩高度）
   ============================================================ */
.app-header {
  border-bottom: 1px solid var(--border);
  background: rgba(18, 24, 18, 0.6);
}
.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;          /* 窄屏时结局藏品行自动换到标题下方 */
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px 9px;
}
/* 标题左侧短竖线（方舟章节标题式） */
.title-bar {
  width: 3px;
  height: 16px;
  background: var(--accent);
  margin-top: 4px;
  flex-shrink: 0;
}
.app-title {
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: var(--fs-title);
  font-weight: 700;
  letter-spacing: 0.05em;
  line-height: 1.25;
  color: var(--text);
  text-shadow: 0 0 12px rgba(139, 26, 26, 0.4);
}
.app-sub {
  font-size: var(--fs-sub);
  color: var(--text-dim);
  letter-spacing: 0.08em;
  margin-top: 1px;
}

/* ---- 结局藏品勾选框（自定义样式，暗金主题） ---- */
.ending-box {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 2px;
}
.ending-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;            /* 略增大，深色背景下更清晰 */
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
/* 三色标签文字：土黄 / 蓝灰（藏青提亮）/ 银白 */
.ending-label.lb-a span { color: #D0A741; }
.ending-label.lb-b span { color: #5B8DB8; }
.ending-label.lb-c span { color: #C8D0CA; }
/* 勾选框最右侧的圆形刷新按钮（仅重置自然物数量，保留勾选状态） */
.ending-reset {
  width: 22px;
  height: 22px;
  padding: 0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border-light);
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.ending-reset:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.ending-reset:active { border-color: var(--accent); background: #233523; }
.ending-check {
  position: relative;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--border-light);
  border-radius: 4px;
  background: var(--bar-track-bg);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.ending-check:hover { border-color: var(--gold-bright); }
.ending-check:checked {
  border-color: var(--gold-bright);
  background: rgba(212, 160, 23, 0.14);
}
/* 暗金色对勾 */
.ending-check::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 6px;
  height: 10px;
  border-right: 2px solid var(--gold-bright);
  border-bottom: 2px solid var(--gold-bright);
  transform: rotate(45deg);
  opacity: 0;
  transition: opacity 0.15s;
}
.ending-check:checked::before { opacity: 1; }
.ending-check:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 2px;
}

/* ============================================================
   主布局：默认单列；≥768px 左输入右排序
   ============================================================ */
.app-main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 12px 0;
  display: grid;
  gap: 10px;
  align-items: start;
}

/* ============================================================
   面板：方舟风斜切角 + 1px 细边框（双层伪元素实现描边贴合斜角）
   ============================================================ */
.panel {
  position: relative;
  background: var(--panel);
  clip-path: var(--bevel);
  padding: 12px;
}
.panel::before,
.panel::after {
  content: "";
  position: absolute;
  pointer-events: none;
}
.panel::before {
  inset: 0;
  background: var(--border);
  clip-path: var(--bevel);
  z-index: -1;
}
.panel::after {
  inset: 1px;
  background: var(--panel);
  clip-path: var(--bevel);
  z-index: -1;
}

/* 区块标题：衬线体 + 左侧短竖线 */
.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: var(--fs-section);
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.section-title::before {
  content: "";
  width: 3px;
  height: 16px;
  background: var(--accent);
  flex-shrink: 0;
}

/* ============================================================
   自然物库存输入区
   ============================================================ */
.mat-list { display: flex; flex-direction: column; }
.mat-list > * + * { border-top: 1px solid var(--border); }

.mat-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 2px;
}

/* emoji 图标底 */
.mat-icon {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--border);
  border-radius: 4px;
  font-size: 16px;
}

.mat-info { flex: 1 1 auto; min-width: 0; }
.mat-name { font-size: var(--fs-mat-name); color: var(--text); }
.mat-desc {
  font-size: var(--fs-mat-desc);
  color: var(--text-dim);
  margin-top: 1px;
}

/* ---- 数量调整区 ---- */
.qty-control {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
/* 按钮：视觉 26×26，触控区 38×38，图标用内联 SVG */
.qty-btn {
  position: relative;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text);
  font-family: inherit;
  line-height: 1;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.qty-btn::before {
  content: "";
  position: absolute;
  z-index: -1;           /* 放在图标之下，避免遮挡 */
  width: 26px;
  height: 26px;
  background: var(--border);
  border: 1px solid var(--border-light);
  transition: border-color 0.15s, background 0.15s;
}
.qty-btn svg { position: relative; display: block; }
.qty-btn:hover { color: #e4eee4; }
.qty-btn:hover::before { border-color: var(--accent); background: #1f2f1f; }
.qty-btn:active::before { border-color: var(--accent); background: #233523; }

/* 数字输入框：透明底 + 下边框 */
.qty-input {
  width: 52px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border-light);
  color: #ffffff;
  font-size: var(--fs-input);
  text-align: center;
  padding: 3px 0 4px;
  font-family: inherit;
  transition: border-color 0.15s;
  -moz-appearance: textfield;
  appearance: textfield;
}
.qty-input::-webkit-outer-spin-button,
.qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty-input:focus { outline: none; border-bottom-color: var(--accent); }

/* ---- 商店招募券净增值行（跟随回声玉米） ---- */
.shop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 2px;
}
.shop-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: var(--fs-shop-label);
  color: var(--text);
}
/* 数据标签：小型菱形装饰 */
.shop-label::before {
  content: "";
  width: 5px;
  height: 5px;
  flex-shrink: 0;
  background: var(--accent);
  transform: rotate(45deg);
}
.shop-value {
  font-size: var(--fs-shop-value);
  font-weight: 600;
  color: var(--gold);
  white-space: nowrap;
  flex-shrink: 0;
}
.shop-value.neg { color: var(--accent); }

/* ---- 重置按钮 ---- */
.mat-actions {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.reset-btn {
  width: 100%;
  padding: 8px 0;
  background: transparent;
  border: 1px solid var(--border-light);
  color: var(--text-dim);
  font-size: var(--fs-shop-label);
  font-family: inherit;
  letter-spacing: 0.12em;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.reset-btn:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.reset-btn:active { border-color: var(--accent); background: #233523; }

/* ============================================================
   作战增值排序区（横向柱状图，按增值从大到小实时排序）
   ============================================================ */
.rank-list { display: flex; flex-direction: column; }

.bar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 6px;
  row-gap: 1px;
  padding: 3px 6px;            /* 紧凑垂直留白，保证移动端一页 */
  transition: background 0.2s;
}
.bar-row + .bar-row { border-top: 1px solid var(--border); }
.bar-row:hover { background: var(--row-hover); }

.bar-name {
  width: 64px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;       /* 名称与 😍 水平居中 */
  justify-content: center;
  gap: 1px;
  font-size: var(--fs-op-name);
  color: var(--text);
}
/* 第一名作战名称下方的 😍 标记 */
.best-emoji {
  display: none;
  font-size: 11px;
  line-height: 1;
}
.bar-row.best .best-emoji { display: block; }
.bar-track {
  flex: 1 1 60px;
  min-width: 0;
  height: 20px;
  background: var(--bar-track-bg);
  clip-path: var(--bevel);
}
.bar-fill {
  height: 100%;
  background: var(--bar-fill);
  clip-path: var(--bevel);
  transition: width 300ms ease-out;
}
.bar-row.best .bar-fill { background: var(--accent); }
/* 最高价值节点：名字改为金色 */
.bar-row.best .bar-name { color: var(--gold-bright); }

.bar-value {
  width: 40px;
  flex-shrink: 0;
  text-align: right;
  font-size: var(--fs-op-value);
  font-weight: 600;
  color: var(--gold);
}
.bar-mark {
  width: 12px;
  flex-shrink: 0;
  color: var(--accent);
}
/* 第一名 ▶ 闪烁 */
.best-mark {
  display: inline-block;
  animation: blink 2s ease-in-out infinite;
}
.bar-meta {
  width: 100%;
  text-align: right;
  font-size: var(--fs-equiv);
  color: var(--text-dim);
}

/* ============================================================
   树海氛围光点（半透明绿色，缓慢上下漂浮，不抢内容）
   ============================================================ */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}
.particle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(150, 205, 160, 0.55), rgba(90, 150, 100, 0.15));
  animation: floaty 8s ease-in-out infinite;
}
.p1 { left: 8%;  top: 16%; width: 4px; height: 4px; animation-duration: 7.5s; animation-delay: -1s; }
.p2 { left: 92%; top: 24%; width: 3px; height: 3px; animation-duration: 9s;  animation-delay: -4s; }
.p3 { left: 13%; top: 70%; width: 5px; height: 5px; animation-duration: 8s;  animation-delay: -2.5s; }
.p4 { left: 89%; top: 66%; width: 3px; height: 3px; animation-duration: 10s; animation-delay: -6s; }
.p5 { left: 50%; top: 90%; width: 4px; height: 4px; animation-duration: 7s;  animation-delay: -3s; }
.p6 { left: 28%; top: 40%; width: 3px; height: 3px; animation-duration: 9.5s; animation-delay: -5s; }

@keyframes floaty {
  0%, 100% { transform: translate(0, 0); opacity: 0.1; }
  30%      { opacity: 0.38; }
  50%      { transform: translate(5px, -28px); opacity: 0.5; }
  70%      { opacity: 0.28; }
}

/* ============================================================
   动效：数字脉动、▶ 闪烁、柱状图首次生长
   ============================================================ */
.pulse { animation: numpulse 0.32s ease-out; }
@keyframes numpulse {
  0%   { transform: scale(1.05); }
  100% { transform: scale(1); }
}
@keyframes blink {
  0%, 100% { opacity: 0.6; }
  50%      { opacity: 1; }
}

/* 页面加载时柱状图从左侧生长（400ms） */
body.loading .bar-fill { transition: width 400ms ease-out; }

/* ============================================================
   均藏对局收录模块（圆角卡片，默认收起，可平滑展开）
   ============================================================ */
.records-panel {
  max-width: 1120px;
  margin: 10px auto 0;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.records-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
}
.records-title {
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: var(--fs-section);
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--gold-bright);   /* 暗金色标题 */
  text-shadow: 0 0 12px rgba(139, 26, 26, 0.3);
}
.records-avg {
  margin-left: auto;
  font-size: var(--fs-equiv);
  color: var(--text-dim);
  white-space: nowrap;
}
/* 均藏数量：等宽字体加粗，暗金色突出 */
.records-avg b {
  font-family: "SF Mono", Consolas, "Liberation Mono", monospace;
  font-weight: 700;
  font-size: var(--fs-op-value);
  color: var(--gold-bright);
}
.records-arrow {
  flex-shrink: 0;
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1;
  transition: transform 0.3s ease;
}
.records-panel.open .records-arrow { transform: rotate(90deg); }

.records-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}

.records-list { display: flex; flex-direction: column; }
.record-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
}
.record-row + .record-row { border-top: 1px solid var(--border); }
.record-desc {
  flex: 3 1 0;               /* 说明输入框：约 60% 宽 */
  min-width: 0;
  background: var(--bar-track-bg);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  color: var(--text);
  font-size: var(--fs-op-name);
  font-family: inherit;
  padding: 6px 8px;
}
.record-num {
  flex: 2 1 0;               /* 数量输入框：约 40% 宽 */
  min-width: 0;
  background: var(--bar-track-bg);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  color: var(--gold-bright);
  font-size: var(--fs-op-name);
  font-family: "SF Mono", Consolas, "Liberation Mono", monospace;
  text-align: center;
  padding: 6px 4px;
  -moz-appearance: textfield;
  appearance: textfield;
}
.record-num::-webkit-outer-spin-button,
.record-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.record-desc:focus, .record-num:focus { outline: none; border-color: var(--accent); }
.record-del {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  background: transparent;
  border: 1px solid var(--border-light);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.record-del:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }

.records-empty {
  display: none;
  padding: 12px;
  font-size: var(--fs-equiv);
  color: var(--text-dim);
  text-align: center;
}
.records-empty.show { display: block; }

.records-actions {
  display: flex;
  gap: 8px;
  padding: 8px 12px 12px;
  border-top: 1px solid var(--border);
}
.records-add {
  flex: 1;
  padding: 7px 0;
  background: transparent;
  border: 1px solid var(--border-light);
  border-radius: 6px;
  color: var(--text);
  font-size: var(--fs-shop-label);
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.records-add:hover { border-color: var(--accent); background: #1f2f1f; }
.records-clear {
  padding: 7px 12px;
  background: transparent;
  border: 1px solid var(--border-light);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: var(--fs-shop-label);
  font-family: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.records-clear:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }

<script>
/* ============================================================
   数据模型 —— 修改此处可调整数据
   ============================================================ */
const materials = [
  { id: 'corn',  name: '回声玉米', emoji: '🌽', desc: '每次招募干员时估价 +3', recruitBonus: 3, partsBonus: 0, battleBonus: 0 },
  { id: 'frost', name: '霜晶树',   emoji: '🌲', desc: '每次作战后估价 +4',     recruitBonus: 0, partsBonus: 0, battleBonus: 4 },
  { id: 'blood', name: '血蕈',     emoji: '🍄', desc: '每次作战后估价 +2',     recruitBonus: 0, partsBonus: 0, battleBonus: 2 },
  { id: 'vine',  name: '板藤',     emoji: '🌰', desc: '每次获得零件时估价 +4', recruitBonus: 0, partsBonus: 4, battleBonus: 0 },
  { id: 'moss',  name: '多生苔藓', emoji: '🌿', desc: '每次获得零件时估价 +1', recruitBonus: 0, partsBonus: 1, battleBonus: 0 }
];

const operations = [
  { id: 'normal',   name: '普通作战', recruitCount: 1, partsCount: 0 },
  { id: 'urgent',   name: '紧急作战', recruitCount: 1, partsCount: 1 },
  { id: 'narrow',   name: '狭路相逢', recruitCount: 2, partsCount: 1 },
  { id: 'resident', name: '小居民点', recruitCount: 1, partsCount: 1 },
  { id: 'outpost',  name: '居民据点', recruitCount: 1, partsCount: 2 }
];

const STORAGE_KEY = 'aks-heiliu-shuhai-materials-v1';

/* 状态：各自然物持有数量 */
const state = {};
for (const m of materials) state[m.id] = 0;

/* ============================================================
   持久化：localStorage 保存 / 恢复
   ============================================================ */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    for (const m of materials) {
      const v = parseInt(obj[m.id], 10);
      state[m.id] = Number.isFinite(v) && v >= 0 ? v : 0;
    }
  } catch (e) { /* 数据损坏时忽略，使用默认值 */ }
}

function saveState() {
  try {
    const obj = {};
    for (const m of materials) obj[m.id] = state[m.id];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
  } catch (e) { /* 隐私模式等场景静默失败 */ }
}

/* 输入清洗：空值按 0，负数 / 小数修正为非负整数 */
function sanitize(raw) {
  if (raw === '' || raw == null) return 0;
  const n = Number(raw);
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.floor(n));
}

/* ============================================================
   核心计算逻辑 —— 修改此处可调整规则
   ============================================================ */
function calcValue(op, mats) {
  let total = 0;
  total += mats.corn  * 3 * op.recruitCount;
  total += mats.frost * 4;
  total += mats.blood * 2;
  total += mats.vine  * 4 * op.partsCount;
  total += mats.moss  * 1 * op.partsCount;
  return total;
}

function getMats() {
  const s = {};
  for (const m of materials) s[m.id] = state[m.id];
  return s;
}

/* ============================================================
   DOM 构建
   ============================================================ */
function buildMaterialRows() {
  const list = document.getElementById('matList');
  list.innerHTML = '';
  materials.forEach(m => {
    const row = document.createElement('div');
    row.className = 'mat-row';
    row.dataset.id = m.id;
    row.innerHTML = `
      <div class="mat-icon" aria-hidden="true">${m.emoji}</div>
      <div class="mat-info">
        <div class="mat-name">${m.name}</div>
        <div class="mat-desc">${m.desc}</div>
      </div>
      <div class="qty-control">
        <button type="button" class="qty-btn" data-act="minus" aria-label="减少${m.name}">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <input class="qty-input" type="number" min="0" step="1" inputmode="numeric" value="0" aria-label="${m.name}数量">
        <button type="button" class="qty-btn" data-act="plus" aria-label="增加${m.name}">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </div>`;
    list.appendChild(row);
    /* 商店招募券净增值行：跟随回声玉米之后 */
    if (m.id === 'corn') {
      const shop = document.createElement('div');
      shop.className = 'shop-row';
      shop.innerHTML = `
        <span class="shop-label">商店招募券净增值：玉米数量 × 3 - 4</span>
        <span class="shop-value" id="shopNet">0</span>`;
      list.appendChild(shop);
    }
  });
}

/* 柱状图行只构建一次，渲染时原地更新 + 按增值重排 */
const rankRefs = [];
function buildRanking() {
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  rankRefs.length = 0;
  operations.forEach(op => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-name"><span>${op.name}</span><span class="best-emoji" aria-hidden="true">😍</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
      <div class="bar-value">0</div>
      <div class="bar-mark"></div>
      <div class="bar-meta"><span>≈ 0.0 收藏品</span></div>`;
    list.appendChild(row);
    rankRefs.push({
      row,
      fill: row.querySelector('.bar-fill'),
      valueEl: row.querySelector('.bar-value'),
      markEl: row.querySelector('.bar-mark'),
      metaEl: row.querySelector('.bar-meta'),
      emojiEl: row.querySelector('.best-emoji')
    });
  });
}

/* ============================================================
   渲染：实时重算 + 按增值从大到小排序
   ============================================================ */
function render() {
  const mats = getMats();
  const values = operations.map(op => calcValue(op, mats));
  const max = Math.max(...values);

  /* 第一排序：总增值从大到小；
     同值时以括号内等效收藏品数量（含紧急作战 / 居民据点额外 +1 奖励）从大到小 */
  const effs = operations.map((op, i) => values[i] / 10 + ((op.id === 'urgent' || op.id === 'outpost') ? 1 : 0));
  const order = operations.map((_, i) => i).sort((a, b) => (values[b] - values[a]) || (effs[b] - effs[a]));
  const bestIdx = order[0];   /* 排在最前的即为第一名 */

  /* 第一名相对普通作战的增值百分比（baseline = 普通作战） */
  const normalIdx = operations.findIndex(op => op.id === 'normal');
  const normalV = values[normalIdx];
  const bestPct = normalV > 0
    ? Math.round(((values[bestIdx] - normalV) / normalV) * 100)
    : (values[bestIdx] > 0 ? Infinity : 0);

  /* 排序变化时重排 DOM 行 */
  const list = document.getElementById('rankList');
  let needReorder = false;
  order.forEach((idx, pos) => {
    if (list.children[pos] !== rankRefs[idx].row) needReorder = true;
  });
  if (needReorder) order.forEach(idx => list.appendChild(rankRefs[idx].row));

  /* —— 柱状图 —— */
  rankRefs.forEach((ref, i) => {
    const v = values[i];
    const isBest = i === bestIdx;
    const pct = max > 0 ? (v / max) * 100 : 0;
    const prev = Number(ref.valueEl.dataset.v ?? -1);

    ref.fill.style.width = pct + '%';
    if (v !== prev) {
      ref.valueEl.textContent = v;
      pulse(ref.valueEl);
    }
    ref.valueEl.dataset.v = v;
    ref.row.classList.toggle('best', isBest);
    ref.markEl.innerHTML = isBest
      ? '<span class="best-mark" aria-label="最高收益">▶</span>'
      : '';
    /* 😍 + 相对普通作战的百分比（位于名称正下方，仅第一名显示） */
    ref.emojiEl.textContent = isBest
      ? '😍 ' + (bestPct === Infinity ? '+∞' : '+' + bestPct + '%')
      : '😍';
    const op = operations[i];
    const equiv = (v / 10).toFixed(1);
    /* 紧急作战 / 居民据点：实际还会多获得 1 收藏品，括号内为包含该奖励的数量 */
    const meta = (op.id === 'urgent' || op.id === 'outpost')
      ? '≈ ' + equiv + ' （' + ((v / 10) + 1).toFixed(1) + '）收藏品'
      : '≈ ' + equiv + ' 收藏品';
    if (ref.metaEl.textContent !== meta) ref.metaEl.textContent = meta;
  });

  /* —— 商店招募券净增值：玉米数量 × 3 - 4 —— */
  const shopNet = mats.corn * 3 - 4;
  const shopEl = document.getElementById('shopNet');
  const shopText = String(shopNet);
  if (shopEl.textContent !== shopText) {
    shopEl.textContent = shopText;
    pulse(shopEl);
  }
  shopEl.classList.toggle('neg', shopNet < 0);
}

/* 数字变化 scale(1.05) 脉动 */
function pulse(el) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.classList.remove('pulse');
  void el.offsetWidth; /* 强制重排以重启动画 */
  el.classList.add('pulse');
}

/* 应用一次增减并同步界面 */
function applyStep(id, delta) {
  state[id] = Math.max(0, state[id] + delta);
  document.querySelector('.mat-row[data-id="' + id + '"] .qty-input').value = state[id];
  saveState();
  render();
}

/* ============================================================
   交互：按钮增减（含长按连续）+ 输入校验（全部实时计算）
   ============================================================ */
function wireInputs() {
  const list = document.getElementById('matList');

  /* 单击 - / +：每次物理点击只增减 1。
     单次增减只由 click 事件执行（pointerdown 不做任何增减，只负责长按计时），
     从根上避免「点一次变动 2」。
     长按完全独立：按住 2000ms 后每 1000ms ±1，松手停止；
     长按结束后的尾随 click 会被吞掉；
     同一物理点击被浏览器派发两次 click（pointer + 兼容 mouse）时，
     用 120ms 时间窗去重，保证一次点击恰好只变动 1。 */
  list.querySelectorAll('.qty-btn').forEach(btn => {
    const id = btn.closest('.mat-row').dataset.id;
    const delta = btn.dataset.act === 'plus' ? 1 : -1;

    /* —— 长按连续调整（独立逻辑，与 click 无叠加） —— */
    let holdTimer = null;
    let repeatTimer = null;
    let repeatActive = false;              /* 长按已开始连续增减 */
    const startHold = () => {
      holdTimer = setTimeout(() => {
        repeatActive = true;
        applyStep(id, delta);
        repeatTimer = setInterval(() => applyStep(id, delta), 1000);
      }, 2000);
    };
    const stopHold = () => {
      clearTimeout(holdTimer);
      if (repeatTimer) clearInterval(repeatTimer);
      holdTimer = null;
      repeatTimer = null;
      /* 兜底：若松手后浏览器未派发尾随 click，稍后恢复正常点击 */
      setTimeout(() => { repeatActive = false; }, 250);
    };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 桌面端忽略 */ }
      startHold();                          /* 仅启动长按计时，不增减 */
    });
    btn.addEventListener('pointerup', stopHold);
    btn.addEventListener('pointercancel', stopHold);
    btn.addEventListener('pointerleave', stopHold);

    /* —— 单次点击：只用 click 增减 1 —— */
    let lastClickAt = -1000;               /* 兼容重复 click 去重窗口 */
    btn.addEventListener('click', () => {
      if (repeatActive) { repeatActive = false; return; }   /* 吞掉长按尾随 click */
      const now = Date.now();
      if (now - lastClickAt < 120) return;                   /* 同一物理点击的重复 click */
      lastClickAt = now;
      applyStep(id, delta);
    });
  });

  /* 输入框：聚焦自动全选，空值按 0，负数 / 小数自动修正 */
  list.querySelectorAll('.qty-input').forEach(input => {
    const row = input.closest('.mat-row');
    const id = row.dataset.id;

    /* 点击输入框自动全选，直接键入即可覆盖旧值 */
    input.addEventListener('focus', () => {
      requestAnimationFrame(() => input.select());
    });

    input.addEventListener('input', () => {
      const raw = input.value;
      if (raw === '') {
        state[id] = 0;                       /* 空值按 0 处理 */
      } else if (!Number.isFinite(Number(raw)) || Number(raw) < 0 || !Number.isInteger(Number(raw))) {
        const fixed = sanitize(raw);         /* 负数 / 小数立即修正 */
        state[id] = fixed;
        input.value = String(fixed);
      } else {
        state[id] = Number(raw);
      }
      saveState();
      render();
    });

    input.addEventListener('blur', () => {
      if (input.value === '') {
        input.value = '0';
        state[id] = 0;
        saveState();
        render();
      }
    });
  });

  /* 重置自然物数量（结局藏品勾选状态保留） */
  const resetMaterials = () => {
    for (const m of materials) state[m.id] = 0;
    document.querySelectorAll('.mat-row').forEach(row => {
      row.querySelector('.qty-input').value = '0';
    });
    saveState();
    render();
  };
  /* 自然物面板底部的「重置」文字按钮：仅重置自然物 */
  document.getElementById('resetBtn').addEventListener('click', resetMaterials);
  /* 勾选框最右侧的圆形刷新按钮：仅重置结局藏品（取消勾选 + 清空本地 + 同步云端），不动自然物 */
  const endingReset = document.getElementById('endingResetBtn');
  if (endingReset) endingReset.addEventListener('click', resetEndings);
}

/* ============================================================
   均藏对局收录：对局记录持久化 + 实时均藏计算
   ============================================================ */
const RECORDS_KEY = 'aks-heiliu-shuhai-records-v1';
const ENDINGS_KEY = 'aks-heiliu-shuhai-endings-v1';
let records = [];          /* [{ desc: 对局说明, num: 收藏品数量 }] */

/* 结局藏品勾选状态（沙盘α / 沙盘β / 怦然信标） */
const endings = { sandboxAlpha: false, sandboxBeta: false, beacon: false };

function loadRecords() {
  try {
    const raw = localStorage.getItem(RECORDS_KEY);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    records = arr.map(r => ({
      desc: typeof r.desc === 'string' ? r.desc : '',
      num: Number.isInteger(Number(r.num)) && Number(r.num) >= 0 ? Number(r.num) : '',
      hasSandboxAlpha: !!r.hasSandboxAlpha,
      hasSandboxBeta: !!r.hasSandboxBeta,
      hasBeacon: !!r.hasBeacon
    }));
  } catch (e) { /* 数据损坏时忽略，使用空列表 */ }
}

function saveRecords() {
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (e) { /* 静默 */ }
}

/* 均藏 = 已填写收藏品数量之和 ÷ 已填写行数（忽略空值 / 非数字） */
function computeAvg() {
  let sum = 0, n = 0;
  for (const r of records) {
    if (r.num !== '' && Number.isInteger(r.num) && r.num >= 0) { sum += r.num; n++; }
  }
  return n > 0 ? sum / n : null;
}

function updateAvgDisplay() {
  const avg = computeAvg();
  document.getElementById('recordsAvg').textContent = avg === null ? '--' : avg.toFixed(1);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderRecords() {
  const list = document.getElementById('recordsList');
  const empty = document.getElementById('recordsEmpty');
  list.innerHTML = '';
  records.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'record-row';
    row.innerHTML = `
      <input type="text" class="record-desc" placeholder="对局说明" maxlength="60" value="${escapeHtml(r.desc)}" aria-label="对局说明">
      <input type="number" class="record-num" min="0" step="1" inputmode="numeric" placeholder="收藏品" value="${r.num}" aria-label="收藏品数量">
      <button type="button" class="record-del" aria-label="删除该对局">×</button>`;
    list.appendChild(row);
    const descIn = row.querySelector('.record-desc');
    const numIn = row.querySelector('.record-num');
    const delBtn = row.querySelector('.record-del');
    descIn.addEventListener('input', () => {
      records[i].desc = descIn.value;
      saveRecords();
      if (currentUser && supabaseClient) queueCloudUpdate(records[i]);
      else if (!descIn._hinted) { descIn._hinted = true; hintLocal(); }
    });
    numIn.addEventListener('input', () => {
      const raw = numIn.value;
      if (raw === '') {
        records[i].num = '';                 /* 空值按未填写处理 */
      } else if (!Number.isFinite(Number(raw)) || Number(raw) < 0 || !Number.isInteger(Number(raw))) {
        const fixed = Math.max(0, Math.floor(Number(raw)));   /* 负数 / 小数修正 */
        records[i].num = fixed;
        numIn.value = String(fixed);
      } else {
        records[i].num = Number(raw);
      }
      saveRecords();
      updateAvgDisplay();
      updateChart();
      if (currentUser && supabaseClient) queueCloudUpdate(records[i]);
      else if (!numIn._hinted) { numIn._hinted = true; hintLocal(); }
    });
    delBtn.addEventListener('click', async () => {
      /* 已登录且该行有云端 id：先删云端，失败则中止（避免本地残留幽灵行） */
      if (currentUser && supabaseClient && records[i].id) {
        const { error } = await supabaseClient.from('duiju_records').delete().eq('id', records[i].id);
        if (error) { showAuthMsg('云端删除失败：' + error.message, true); return; }
      } else if (!currentUser) {
        hintLocal();
      }
      records.splice(i, 1);
      saveRecords();
      renderRecords();
    });
  });
  empty.classList.toggle('show', records.length === 0);
  updateAvgDisplay();
  updateChart();
  /* 展开状态下新增 / 删除行后，刷新展开高度，避免内容被裁剪 */
  const panel = document.getElementById('recordsPanel');
  if (panel.classList.contains('open')) {
    const body = document.getElementById('recordsBody');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function wireRecords() {
  const panel = document.getElementById('recordsPanel');
  const head = document.getElementById('recordsHead');
  const body = document.getElementById('recordsBody');

  /* 点击标题行或箭头展开 / 收起（平滑高度过渡） */
  head.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    head.setAttribute('aria-expanded', String(open));
    body.style.maxHeight = open ? (body.scrollHeight + 'px') : '0px';
  });

  /* 窗口尺寸变化时同步展开高度 */
  window.addEventListener('resize', () => {
    if (panel.classList.contains('open')) {
      body.style.maxHeight = body.scrollHeight + 'px';
    }
  });

  /* + 添加对局：登录后先写入云端，未登录则暂存本机并提示登录 */
  document.getElementById('recordsAddBtn').addEventListener('click', async () => {
    /* 新对局快照当前结局藏品勾选状态，随云端一起保存 */
    const rec = {
      desc: '', num: '',
      hasSandboxAlpha: endings.sandboxAlpha,
      hasSandboxBeta: endings.sandboxBeta,
      hasBeacon: endings.beacon
    };
    if (currentUser && supabaseClient) {
      const row = await cloudInsert(rec);
      if (!row) return;          /* 云端写入失败，不产生本地幽灵行 */
      rec.id = row.id;
    } else {
      hintLocal();
    }
    records.push(rec);
    saveRecords();
    renderRecords();
    const rows = document.querySelectorAll('.record-row');
    const last = rows[rows.length - 1];
    if (last) last.querySelector('.record-desc').focus();
  });

  /* 清空全部对局：确认后清空并重置均藏 */
  document.getElementById('recordsClearBtn').addEventListener('click', async () => {
    const btn = document.getElementById('recordsClearBtn');
    let confirmed = false;
    try {
      confirmed = window.confirm('确认清空全部对局记录？此操作不可恢复。');
    } catch (e) {
      /* 弹窗被环境禁用：降级为按钮二次点击确认 */
      if (btn.dataset.arm === '1') {
        btn.dataset.arm = '';
        btn.textContent = '清空全部对局';
        confirmed = true;
      } else {
        btn.dataset.arm = '1';
        btn.textContent = '再次点击确认清空';
        setTimeout(() => {
          btn.dataset.arm = '';
          btn.textContent = '清空全部对局';
        }, 3500);
      }
    }
    if (!confirmed) return;
    if (currentUser && supabaseClient) {
      /* Supabase 禁止无条件 delete：逐条删除当前用户记录（RLS 限定本人） */
      for (const r of records) {
        if (r.id) await supabaseClient.from('duiju_records').delete().eq('id', r.id);
      }
    }
    records = [];
    saveRecords();
    renderRecords();
  });
}

/* ============================================================
   结局藏品勾选状态：localStorage 持久化 + 云端同步（节流）
   ============================================================ */
function loadEndings() {
  try {
    const raw = localStorage.getItem(ENDINGS_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    endings.sandboxAlpha = !!obj.sandboxAlpha;
    endings.sandboxBeta = !!obj.sandboxBeta;
    endings.beacon = !!obj.beacon;
  } catch (e) { /* 数据损坏时忽略，保持默认 */ }
}
function saveEndings() {
  try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(endings)); } catch (e) { /* 静默 */ }
}
/* 将结局藏品状态回显到顶部三个勾选框 */
function syncEndingChecks() {
  const map = { endingAlpha: endings.sandboxAlpha, endingBeta: endings.sandboxBeta, endingBeacon: endings.beacon };
  for (const [id, v] of Object.entries(map)) {
    const el = document.getElementById(id);
    if (el) el.checked = !!v;
  }
}
/* 仅重置结局藏品：取消三个勾选、清空本地存储并同步云端（不动自然物数量） */
function resetEndings() {
  endings.sandboxAlpha = false;
  endings.sandboxBeta = false;
  endings.beacon = false;
  try { localStorage.removeItem(ENDINGS_KEY); } catch (e) { /* 静默 */ }
  syncEndingChecks();
  queueEndingSync();
}
/* 结局藏品云端同步：节流 400ms，写入最近一局（随该行记录携带） */
let endingTimer = null;
async function syncEndingsToCloud() {
  if (!currentUser || !supabaseClient) return;
  const last = records[records.length - 1];
  if (!last || !last.id) return;   /* 尚无云端记录：状态随下次新增一起提交 */
  last.hasSandboxAlpha = endings.sandboxAlpha;
  last.hasSandboxBeta = endings.sandboxBeta;
  last.hasBeacon = endings.beacon;
  await cloudUpdate(last);
}
function queueEndingSync() {
  clearTimeout(endingTimer);
  endingTimer = setTimeout(syncEndingsToCloud, 400);
}
function wireEndings() {
  const pairs = [
    ['endingAlpha', 'sandboxAlpha'],
    ['endingBeta', 'sandboxBeta'],
    ['endingBeacon', 'beacon']
  ];
  pairs.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => {
      endings[key] = el.checked;
      saveEndings();
      queueEndingSync();
    });
  });
}

/* ============================================================
   对局收藏品数量折线图（Chart.js，数据随 records 实时更新）
   ============================================================ */
let relicChart = null;
/* 折线图中收藏品数量最高的数据点下标集合（用于 ⭐ 星形标记） */
let chartMaxSet = new Set();
/* 当前均藏数值（有效收藏品数量的平均值），供参考虚线使用；无有效值时 null */
let chartAvgValue = null;

/* 均藏参考线：水平虚线（#5B8DB8），右上方标注「均藏 x.x」 */
const avgLinePlugin = {
  id: 'avgLine',
  afterDatasetsDraw(chart) {
    const avg = chartAvgValue;
    if (!(avg > 0) || chart.data.datasets.length === 0) return;
    const y = chart.scales.y.getPixelForValue(avg);
    if (!Number.isFinite(y)) return;
    const { left, right } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = '#5B8DB8';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#5B8DB8';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('均藏 ' + avg.toFixed(1), right, y - 3);
    ctx.restore();
  }
};

function updateChart() {
  const canvas = document.getElementById('relicChart');
  const empty = document.getElementById('chartEmpty');
  if (!canvas || !empty) return;
  if (typeof Chart === 'undefined') {
    empty.textContent = '图表组件加载失败';
    empty.style.display = 'flex';
    return;
  }
  if (records.length === 0) {
    empty.textContent = '暂无数据，请添加对局';
    empty.style.display = 'flex';
    if (relicChart) { relicChart.destroy(); relicChart = null; }
    return;
  }
  empty.style.display = 'none';
  /* X 轴为局数顺序（第 1 局…第 N 局），Y 轴为每局收藏品数量，空值显示为断点 */
  const labels = records.map((_, i) => '第' + (i + 1) + '局');
  const data = records.map(r => (r.num !== '' && r.num != null ? r.num : null));
  /* 计算最高值下标（忽略空值断点；多个并列最高都标记） */
  chartMaxSet.clear();
  let maxV = -Infinity;
  data.forEach((v) => { if (v != null && v > maxV) maxV = v; });
  data.forEach((v, i) => { if (v != null && v === maxV) chartMaxSet.add(i); });
  /* 均藏参考线数值：有效收藏品数量的平均值（无有效值时 null，不画线） */
  const validVals = data.filter(v => v != null);
  chartAvgValue = validVals.length ? validVals.reduce((a, b) => a + b, 0) / validVals.length : null;
  if (relicChart) {
    relicChart.data.labels = labels;
    relicChart.data.datasets[0].data = data;
    relicChart.update();
    return;
  }
  relicChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '收藏品数量',
        data,
        borderColor: '#d4a017',                  /* 暗金折线 */
        backgroundColor: 'rgba(212, 160, 23, 0.12)',
        /* 最高收藏品数量的数据点以 ⭐ 星形（暗金）突出，其余为暗红圆点 */
        pointStyle: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? 'star' : 'circle'),
        pointRadius: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? 5 : 3),
        pointBackgroundColor: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? '#d4a017' : '#8b1a1a'),
        pointBorderColor: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? '#d4a017' : '#d4a017'),
        borderWidth: 2,
        tension: 0.3,
        spanGaps: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          grid: { color: '#1a2a1a' },            /* 深灰网格 */
          ticks: { color: '#6a7a6a', font: { size: 10 } }
        },
        y: {
          beginAtZero: true,
          grid: { color: '#1a2a1a' },
          ticks: { color: '#6a7a6a', font: { size: 10 }, precision: 0 }
        }
      }
    },
    plugins: [avgLinePlugin]   /* 均藏参考虚线（#5B8DB8） */
  });
}

/* 云端读取当前用户全部对局（RLS 按用户过滤），替换本地 records */
async function loadCloudRecords() {
  if (!supabaseClient || !currentUser) return;
  const { data, error } = await supabaseClient.from('duiju_records').select('*');
  if (error) { showAuthMsg('云端读取失败：' + error.message, true); return; }
  const rows = data || [];
  if (rows.length && rows[0].created_at) {
    rows.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
  }
  records = rows.map(r => ({
    id: r.id,
    desc: typeof r.description === 'string' ? r.description : '',
    num: Number.isInteger(Number(r.relic_count)) && Number(r.relic_count) >= 0 ? Number(r.relic_count) : '',
    hasSandboxAlpha: !!r.has_sandbox_alpha,
    hasSandboxBeta: !!r.has_sandbox_beta,
    hasBeacon: !!r.has_beacon
  }));
  saveRecords();   /* 同时缓存一份到本机 */
  /* 结局藏品勾选状态取最近一局（登录后以云端为准），回显到顶部勾选框 */
  if (records.length) {
    const last = records[records.length - 1];
    endings.sandboxAlpha = !!last.hasSandboxAlpha;
    endings.sandboxBeta = !!last.hasSandboxBeta;
    endings.beacon = !!last.hasBeacon;
    saveEndings();
    syncEndingChecks();
  }
}

/* 云端单条：新增 / 修改 */
async function cloudInsert(rec) {
  // 必须带上 user_id，否则会触发 RLS 策略报错
  // 注意：relic_count 为空字符串时转为 null 或 0，这里按 null 处理
  const { data, error } = await supabaseClient.from('duiju_records').insert({
    user_id: currentUser.id,
    description: rec.desc,
    relic_count: rec.num === '' ? null : Number(rec.num),
    has_sandbox_alpha: !!rec.hasSandboxAlpha,
    has_sandbox_beta: !!rec.hasSandboxBeta,
    has_beacon: !!rec.hasBeacon
  }).select();
  if (error) { showAuthMsg('云端添加失败：' + error.message, true); return null; }
  return data && data[0] ? data[0] : null;
}
async function cloudUpdate(rec) {
  if (!rec.id) return;
  const { error } = await supabaseClient.from('duiju_records').update({
    description: rec.desc,
    relic_count: rec.num === '' ? null : Number(rec.num),
    has_sandbox_alpha: !!rec.hasSandboxAlpha,
    has_sandbox_beta: !!rec.hasSandboxBeta,
    has_beacon: !!rec.hasBeacon
  }).eq('id', rec.id);

}

  wireRecords();

  document.querySelectorAll('.mat-row').forEach(row => {

  requestAnimationFrame(() => requestAnimationFrame(render));
