<html lang="zh-CN">

<title>军藏思维计算仪 · 黑流树海</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d0a'/%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%238b1a1a'/%3E%3Cpath d='M16 10 21 16 16 22 11 16Z' fill='%23d4a017'/%3E%3C/svg%3E">

<style>
:root {
  --bg: #0a0d0a;
  --panel: #121812;
  --border: #1a2a1a;
  --border-light: #2a3a2a;
  --text: #c8d4c8;
  --text-dim: #6a7a6a;
  --accent: #8b1a1a;
  --gold: #b8860b;
  --gold-bright: #d4a017;
  --bar-track-bg: #0f150f;
  --row-hover: #161e16;
  --bar-fill: #2a3a2a;
  --green-fixed: #5cb85c;

  --fs-title: 20px;
  --fs-sub: 10px;
  --fs-section: 13px;
  --fs-mat-name: 13px;
  --fs-mat-desc: 10px;
  --fs-input: 16px;
  --fs-op-name: 12px;
  --fs-op-value: 15px;
  --fs-equiv: 10px;
  --fs-shop-label: 12px;
  --fs-shop-value: 15px;

  --bevel: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  background:
    radial-gradient(900px 520px at 50% -120px, rgba(139, 26, 26, 0.10), transparent 70%),
    radial-gradient(720px 420px at 108% 104%, rgba(26, 58, 26, 0.10), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: 24px;
}
::selection { background: rgba(139, 26, 26, 0.45); }

.app-header { border-bottom: 1px solid var(--border); background: rgba(18, 24, 18, 0.6); }
.header-inner {
  max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; padding: 12px 16px 9px;
}
.title-bar { width: 3px; height: 16px; background: var(--accent); margin-top: 4px; flex-shrink: 0; }
.app-title {
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: var(--fs-title); font-weight: 700; letter-spacing: 0.05em; line-height: 1.25; color: var(--text); text-shadow: 0 0 12px rgba(139, 26, 26, 0.4);
}
.app-sub { font-size: var(--fs-sub); color: var(--text-dim); letter-spacing: 0.08em; margin-top: 1px; }

.ending-box { margin-left: auto; display: flex; align-items: center; gap: 12px; padding-top: 2px; }
.ending-label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none; -webkit-user-select: none; }
.ending-label.lb-a span { color: #D0A741; }
.ending-label.lb-b span { color: #5B8DB8; }
.ending-label.lb-c span { color: #C8D0CA; }
.ending-reset {
  width: 22px; height: 22px; padding: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: transparent; border: 1px solid var(--border-light); color: var(--text-dim); cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.ending-reset:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.ending-reset:active { border-color: var(--accent); background: #233523; }
.ending-check {
  position: relative; width: 16px; height: 16px; flex-shrink: 0; appearance: none; -webkit-appearance: none; border: 1px solid var(--border-light); border-radius: 4px; background: var(--bar-track-bg); cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.ending-check:hover { border-color: var(--gold-bright); }
.ending-check:checked { border-color: var(--gold-bright); background: rgba(212, 160, 23, 0.14); }
.ending-check::before {
  content: ""; position: absolute; left: 4px; top: 1px; width: 6px; height: 10px; border-right: 2px solid var(--gold-bright); border-bottom: 2px solid var(--gold-bright); transform: rotate(45deg); opacity: 0; transition: opacity 0.15s;
}
.ending-check:checked::before { opacity: 1; }

.app-main { max-width: 1120px; margin: 0 auto; padding: 10px 12px 0; display: grid; gap: 10px; align-items: start; }
.panel { position: relative; background: var(--panel); clip-path: var(--bevel); padding: 12px; }
.panel::before, .panel::after { content: ""; position: absolute; pointer-events: none; }
.panel::before { inset: 0; background: var(--border); clip-path: var(--bevel); z-index: -1; }
.panel::after { inset: 1px; background: var(--panel); clip-path: var(--bevel); z-index: -1; }
.section-title {
  display: flex; align-items: center; gap: 8px; font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: var(--fs-section); font-weight: 600; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 8px;
}
.section-title::before { content: ""; width: 3px; height: 16px; background: var(--accent); flex-shrink: 0; }

.mat-list { display: flex; flex-direction: column; }
.mat-list > * + * { border-top: 1px solid var(--border); }
.mat-row { display: flex; align-items: center; gap: 8px; padding: 6px 2px; }
.mat-icon { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--border); border-radius: 4px; font-size: 16px; }
.mat-info { flex: 1 1 auto; min-width: 0; }
.mat-name { font-size: var(--fs-mat-name); color: var(--text); }
.mat-desc { font-size: var(--fs-mat-desc); color: var(--text-dim); margin-top: 1px; }

.qty-control { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.qty-btn {
  position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer; color: var(--text); font-family: inherit; line-height: 1; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.qty-btn::before { content: ""; position: absolute; z-index: -1; width: 26px; height: 26px; background: var(--border); border: 1px solid var(--border-light); transition: border-color 0.15s, background 0.15s; }
.qty-btn svg { position: relative; display: block; }
.qty-btn:hover { color: #e4eee4; }
.qty-btn:hover::before { border-color: var(--accent); background: #1f2f1f; }
.qty-btn:active::before { border-color: var(--accent); background: #233523; }

.qty-input {
  width: 52px; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: #ffffff; font-size: var(--fs-input); text-align: center; padding: 3px 0 4px; font-family: inherit; transition: border-color 0.15s; -moz-appearance: textfield; appearance: textfield;
}
.qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty-input:focus { outline: none; border-bottom-color: var(--accent); }

.shop-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 2px; }
.shop-label { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-shop-label); color: var(--text); }
.shop-label::before { content: ""; width: 5px; height: 5px; flex-shrink: 0; background: var(--accent); transform: rotate(45deg); }
.shop-value { font-size: var(--fs-shop-value); font-weight: 600; color: var(--gold); white-space: nowrap; flex-shrink: 0; }
.shop-value.neg { color: var(--accent); }

.mat-actions { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.reset-btn {
  width: 100%; padding: 8px 0; background: transparent; border: 1px solid var(--border-light); color: var(--text-dim); font-size: var(--fs-shop-label); font-family: inherit; letter-spacing: 0.12em; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.reset-btn:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.reset-btn:active { border-color: var(--accent); background: #233523; }

.rank-list { display: flex; flex-direction: column; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; row-gap: 1px; padding: 3px 6px; transition: background 0.2s; }
.bar-row + .bar-row { border-top: 1px solid var(--border); }
.bar-row:hover { background: var(--row-hover); }
.bar-name { width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: var(--fs-op-name); color: var(--text); }
.best-emoji { display: none; font-size: 11px; line-height: 1; }
.bar-row.best .best-emoji { display: block; }
.bar-track { flex: 1 1 60px; min-width: 0; height: 20px; background: var(--bar-track-bg); clip-path: var(--bevel); }
.bar-fill { height: 100%; background: var(--bar-fill); clip-path: var(--bevel); transition: width 300ms ease-out; }
.bar-row.best .bar-fill { background: var(--accent); }
.bar-row.best .bar-name { color: var(--gold-bright); }
.bar-value { width: 40px; flex-shrink: 0; text-align: right; font-size: var(--fs-op-value); font-weight: 600; color: var(--gold); }
.bar-mark { width: 12px; flex-shrink: 0; color: var(--accent); }
.best-mark { display: inline-block; animation: blink 2s ease-in-out infinite; }
.bar-meta { width: 100%; text-align: right; font-size: var(--fs-equiv); color: var(--text-dim); }

.particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.particle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(150, 205, 160, 0.55), rgba(90, 150, 100, 0.15)); animation: floaty 8s ease-in-out infinite; }
.p1 { left: 8%; top: 16%; width: 4px; height: 4px; animation-duration: 7.5s; animation-delay: -1s; }
.p2 { left: 92%; top: 24%; width: 3px; height: 3px; animation-duration: 9s; animation-delay: -4s; }
.p3 { left: 13%; top: 70%; width: 5px; height: 5px; animation-duration: 8s; animation-delay: -2.5s; }
.p4 { left: 89%; top: 66%; width: 3px; height: 3px; animation-duration: 10s; animation-delay: -6s; }
.p5 { left: 50%; top: 90%; width: 4px; height: 4px; animation-duration: 7s; animation-delay: -3s; }
.p6 { left: 28%; top: 40%; width: 3px; height: 3px; animation-duration: 9.5s; animation-delay: -5s; }

@keyframes floaty {
  0%, 100% { transform: translate(0, 0); opacity: 0.1; }
  30%      { opacity: 0.38; }
  50%      { transform: translate(5px, -28px); opacity: 0.5; }
  70%      { opacity: 0.28; }
}
.pulse { animation: numpulse 0.32s ease-out; }
@keyframes numpulse { 0% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes blink { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
body.loading .bar-fill { transition: width 400ms ease-out; }

.records-panel { max-width: 1120px; margin: 10px auto 0; padding: 0 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.records-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: transparent; border: none; cursor: pointer; text-align: left; }
.records-title { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-size: var(--fs-section); font-weight: 600; letter-spacing: 0.05em; color: var(--gold-bright); text-shadow: 0 0 12px rgba(139, 26, 26, 0.3); }
.records-avg { margin-left: auto; font-size: var(--fs-equiv); color: var(--text-dim); white-space: nowrap; }
.records-avg b { font-family: "SF Mono", Consolas, "Liberation Mono", monospace; font-weight: 700; font-size: var(--fs-op-value); color: var(--gold-bright); }
.records-arrow { flex-shrink: 0; color: var(--text-dim); font-size: 12px; line-height: 1; transition: transform 0.3s ease; }
.records-panel.open .records-arrow { transform: rotate(90deg); }
.records-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }

.records-list { display: flex; flex-direction: column; }
.record-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
.record-row + .record-row { border-top: 1px solid var(--border); }
.record-desc { flex: 3 1 0; min-width: 0; background: var(--bar-track-bg); border: 1px solid var(--border-light); border-radius: 6px; color: var(--text); font-size: var(--fs-op-name); font-family: inherit; padding: 6px 8px; }
.record-num { flex: 2 1 0; min-width: 0; background: var(--bar-track-bg); border: 1px solid var(--border-light); border-radius: 6px; color: var(--gold-bright); font-size: var(--fs-op-name); font-family: "SF Mono", Consolas, "Liberation Mono", monospace; text-align: center; padding: 6px 4px; -moz-appearance: textfield; appearance: textfield; }
.record-num::-webkit-outer-spin-button, .record-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.record-desc:focus, .record-num:focus { outline: none; border-color: var(--accent); }
.record-del { flex-shrink: 0; width: 28px; height: 28px; background: transparent; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dim); font-size: 15px; line-height: 1; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
.record-del:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.records-empty { display: none; padding: 12px; font-size: var(--fs-equiv); color: var(--text-dim); text-align: center; }
.records-empty.show { display: block; }
.records-actions { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid var(--border); }
.records-add { flex: 1; padding: 7px 0; background: transparent; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text); font-size: var(--fs-shop-label); font-family: inherit; cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s; }
.records-add:hover { border-color: var(--accent); background: #1f2f1f; }
.records-clear { padding: 7px 12px; background: transparent; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dim); font-size: var(--fs-shop-label); font-family: inherit; white-space: nowrap; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
.records-clear:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }

.auth-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); background: rgba(15, 21, 15, 0.6); }
.auth-input { flex: 1 1 110px; min-width: 0; background: var(--bar-track-bg); border: 1px solid var(--border-light); border-radius: 6px; color: var(--text); font-size: var(--fs-op-name); font-family: inherit; padding: 6px 8px; }
.auth-input:focus { outline: none; border-color: var(--accent); }
.auth-btn { padding: 6px 12px; background: transparent; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dim); font-size: var(--fs-op-name); font-family: inherit; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
.auth-btn:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.auth-user { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-op-name); color: var(--gold-bright); }
.auth-status { flex: 1 1 100%; font-size: var(--fs-equiv); color: var(--text-dim); }
.auth-status.err { color: var(--accent); }
.auth-status.ok { color: var(--gold-bright); }

.chart-wrap { position: relative; height: 170px; padding: 10px 12px 12px; border-top: 1px solid var(--border); }
.chart-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: var(--fs-equiv); color: var(--text-dim); }

.enc-inner { padding: 10px 12px 12px; }
.enc-floors { display: flex; gap: 4px; margin-bottom: 10px; }
.enc-floor-btn { flex: 1 1 0; min-width: 0; padding: 6px 0; background: transparent; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dim); font-size: 11px; font-family: inherit; white-space: nowrap; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
.enc-floor-btn:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.enc-floor-btn.active { border-color: var(--gold-bright); color: var(--gold-bright); background: rgba(212, 160, 23, 0.12); }

.enc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.enc-item { display: flex; align-items: flex-start; gap: 4px; min-width: 0; cursor: pointer; user-select: none; -webkit-user-select: none; }
.enc-check { position: relative; width: 14px; height: 14px; margin-top: 1px; flex-shrink: 0; appearance: none; -webkit-appearance: none; border: 1px solid var(--border-light); border-radius: 3px; background: var(--bar-track-bg); cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.enc-check:hover { border-color: var(--gold-bright); }
.enc-check:checked { border-color: var(--gold-bright); background: rgba(212, 160, 23, 0.14); }
.enc-check::before { content: ""; position: absolute; left: 3px; top: 0; width: 5px; height: 9px; border-right: 1.8px solid var(--gold-bright); border-bottom: 1.8px solid var(--gold-bright); transform: rotate(45deg); opacity: 0; transition: opacity 0.15s; }
.enc-check:checked::before { opacity: 1; }

.enc-name { min-width: 0; font-size: 11px; line-height: 1.25; color: var(--text); word-break: break-all; transition: color 0.15s; }

/* 当前层数可出现的事件：名称改为金色 */
.enc-item.available .enc-name { color: var(--gold-bright); }
/* 被勾选的事件名称变为红色（优先于金色） */
.enc-item.checked .enc-name { color: var(--accent) !important; }
/* 货从口出固定为绿色（最高优先级） */
.enc-item[data-name="货从口出（马头）"] .enc-name { color: var(--green-fixed) !important; }

.enc-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.enc-reset { flex: 1; padding: 7px 0; background: transparent; border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dim); font-size: var(--fs-shop-label); font-family: inherit; letter-spacing: 0.08em; cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s; }
.enc-reset:hover { border-color: var(--accent); color: var(--text); background: #1f2f1f; }
.enc-reset:active { border-color: var(--accent); background: #233523; }

.install-fab { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; background: var(--accent); color: #f4ead6; border: 1px solid var(--gold); border-radius: 999px; font-family: inherit; font-size: 13px; letter-spacing: 0.06em; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); transition: transform 0.15s, filter 0.15s; }
.install-fab:hover { filter: brightness(1.12); }
.install-fab:active { transform: scale(0.96); }
.install-fab[hidden] { display: none; }
.install-fab svg { display: block; }

@media (min-width: 768px) { .app-main { grid-template-columns: 300px 1fr; } }
@media (min-width: 1024px) {
  :root {
    --fs-title: 21px; --fs-sub: 11px; --fs-section: 14px; --fs-mat-name: 14px; --fs-mat-desc: 11px; --fs-input: 17px; --fs-op-name: 13px; --fs-op-value: 16px; --fs-equiv: 11px; --fs-shop-label: 13px; --fs-shop-value: 16px;
  }
  .app-main { grid-template-columns: 340px 1fr; }
}
@media (max-width: 767px) {
  .ending-box { width: 100%; justify-content: flex-end; gap: 14px; padding-top: 4px; }
  .ending-label { font-size: 14px; gap: 6px; min-height: 28px; padding: 3px 2px; }
  .ending-check { width: 20px; height: 20px; }
  .ending-check::before { left: 5px; top: 2px; width: 7px; height: 12px; }
  .ending-reset { width: 24px; height: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <span class="title-bar" aria-hidden="true"></span>
    <div>
      <h1 class="app-title">军藏思维计算仪</h1>
      <p class="app-sub">沉沦者的黑流树海 · 自然物增值推演</p>
    </div>
    <div class="ending-box" id="endingBox">
      <label class="ending-label lb-a">
        <input type="checkbox" class="ending-check" id="endingAlpha" aria-label="沙盘α">
        <span>沙盘α</span>
      </label>
      <label class="ending-label lb-b">
        <input type="checkbox" class="ending-check" id="endingBeta" aria-label="沙盘β">
        <span>沙盘β</span>
      </label>

<noscript><p style="text-align:center;padding:24px;color:#6a7a6a;">本工具需要启用 JavaScript 才能计算。</p></noscript>

<script>
const materials = [
  { id: 'corn',  name: '回声玉米', emoji: '🌽', desc: '每次招募干员时估价 +3', recruitBonus: 3, partsBonus: 0, battleBonus: 0 },
  { id: 'heartgrass', name: '恋心草', emoji: '🔥', desc: '每次作战后估价 +6', recruitBonus: 0, partsBonus: 0, battleBonus: 6 },
  { id: 'frost', name: '霜晶树',   emoji: '🌲', desc: '每次作战后估价 +4',     recruitBonus: 0, partsBonus: 0, battleBonus: 4 },
  { id: 'blood', name: '血蕈',     emoji: '🍄', desc: '每次作战后估价 +2',     recruitBonus: 0, partsBonus: 0, battleBonus: 2 },
  { id: 'vine',  name: '板藤',     emoji: '🌰', desc: '每次获得零件时估价 +4', recruitBonus: 0, partsBonus: 4, battleBonus: 0 },
  { id: 'moss',  name: '多生苔藓', emoji: '🌿', desc: '每次获得零件时估价 +1', recruitBonus: 0, partsBonus: 1, battleBonus: 0 }
];

const operations = [
  { id: 'normal',   name: '普通作战', recruitCount: 1, partsCount: 0 },
  { id: 'urgent',   name: '紧急作战', recruitCount: 1, partsCount: 1 },
  { id: 'narrow',   name: '狭路相逢', recruitCount: 2, partsCount: 1 },
  { id: 'resident', name: '小居民点', recruitCount: 1, partsCount: 1 },
  { id: 'outpost',  name: '居民据点', recruitCount: 1, partsCount: 2 }
];

// 更新了名称（保留外号，去掉数字）和湖中仙女的层数
const encounters = [
  { name: '鸭托邦（熊本）', floors: [3, 4] },
  { name: '传奇团伙（鸭本）', floors: [4, 5, 6] },
  { name: '湖中仙女（仙人跳）', floors: [3, 4, 5] },
  { name: '洞中宝（挖宝）', floors: [3, 4] },
  { name: '货从口出（马头）', floors: [2, 3, 4, 5, 6] },
  { name: '沉重的契约（五火）', floors: [2, 3, 4, 5] },
  { name: '敲动杠杆（地鼠）', floors: [1, 2, 3, 4, 5, 6] },
  { name: '血衣之下（剑锤）', floors: [2, 3, 4, 5] },
  { name: '擒与缚（老鹰）', floors: [3, 4, 5, 6] },
  { name: '黑诞（追猎图）', floors: [3, 4, 5] },
  { name: '呼吸的红苔（沃土）', floors: [2, 3, 4] },
  { name: '被歌颂的影子（大狗跳）', floors: [2, 3, 4, 5, 6] },
  { name: '愈创之心（追忆）', floors: [4] },
  { name: '临时中介所（临招）', floors: [2, 3, 4, 5] },
  { name: '和平守卫者（火杆）', floors: [4, 5] },
  { name: '独活（应急）', floors: [2, 3, 4] }
];

const STORAGE_KEY = 'aks-heiliu-shuhai-materials-v1';
const RECORDS_KEY = 'aks-heiliu-shuhai-records-v1';
const ENDINGS_KEY = 'aks-heiliu-shuhai-endings-v1';
const ENCOUNTERS_KEY = 'aks-heiliu-shuhai-unexpected-encounters-v1';

const state = {};
for (const m of materials) state[m.id] = 0;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    for (const m of materials) {
      const v = parseInt(obj[m.id], 10);
      state[m.id] = Number.isFinite(v) && v >= 0 ? v : 0;
    }
  } catch (e) { }
}
function saveState() {
  try {
    const obj = {};
    for (const m of materials) obj[m.id] = state[m.id];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
  } catch (e) { }
}
function sanitize(raw) {
  if (raw === '' || raw == null) return 0;
  const n = Number(raw);
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.floor(n));
}

function calcValue(op, mats) {
  let total = 0;
  total += mats.corn  * 3 * op.recruitCount;
  total += mats.heartgrass * 6;
  total += mats.frost * 4;
  total += mats.blood * 2;
  total += mats.vine  * 4 * op.partsCount;
  total += mats.moss  * 1 * op.partsCount;
  return total;
}
function getMats() {
  const s = {};
  for (const m of materials) s[m.id] = state[m.id];
  return s;
}

function buildMaterialRows() {
  const list = document.getElementById('matList');
  list.innerHTML = '';
  materials.forEach(m => {
    const row = document.createElement('div');
    row.className = 'mat-row';
    row.dataset.id = m.id;
    row.innerHTML = `
      <div class="mat-icon" aria-hidden="true">${m.emoji}</div>
      <div class="mat-info">
        <div class="mat-name">${m.name}</div>
        <div class="mat-desc">${m.desc}</div>
      </div>
      <div class="qty-control">
        <button type="button" class="qty-btn" data-act="minus" aria-label="减少${m.name}">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <input class="qty-input" type="number" min="0" step="1" inputmode="numeric" value="0" aria-label="${m.name}数量">
        <button type="button" class="qty-btn" data-act="plus" aria-label="增加${m.name}">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </div>`;
    list.appendChild(row);
    if (m.id === 'corn') {
      const shop = document.createElement('div');
      shop.className = 'shop-row';
      shop.innerHTML = `
        <span class="shop-label">商店招募券净增值：玉米数量 × 3 - 4</span>
        <span class="shop-value" id="shopNet">0</span>`;
      list.appendChild(shop);
    }
  });
}

const rankRefs = [];
function buildRanking() {
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  rankRefs.length = 0;
  operations.forEach(op => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-name"><span>${op.name}</span><span class="best-emoji" aria-hidden="true">😍</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
      <div class="bar-value">0</div>
      <div class="bar-mark"></div>
      <div class="bar-meta"><span>≈ 0.0 收藏品</span></div>`;
    list.appendChild(row);
    rankRefs.push({
      row,
      fill: row.querySelector('.bar-fill'),
      valueEl: row.querySelector('.bar-value'),
      markEl: row.querySelector('.bar-mark'),
      metaEl: row.querySelector('.bar-meta'),
      emojiEl: row.querySelector('.best-emoji')
    });
  });
}

function render() {
  const mats = getMats();
  const values = operations.map(op => calcValue(op, mats));
  const max = Math.max(...values);

  const effs = operations.map((op, i) => values[i] / 10 + ((op.id === 'urgent' || op.id === 'outpost') ? 1 : 0));
  const order = operations.map((_, i) => i).sort((a, b) => (values[b] - values[a]) || (effs[b] - effs[a]));
  const bestIdx = order[0];

  const normalIdx = operations.findIndex(op => op.id === 'normal');
  const normalV = values[normalIdx];
  const bestPct = normalV > 0
    ? Math.round(((values[bestIdx] - normalV) / normalV) * 100)
    : (values[bestIdx] > 0 ? Infinity : 0);

  const list = document.getElementById('rankList');
  let needReorder = false;
  order.forEach((idx, pos) => {
    if (list.children[pos] !== rankRefs[idx].row) needReorder = true;
  });
  if (needReorder) order.forEach(idx => list.appendChild(rankRefs[idx].row));

  rankRefs.forEach((ref, i) => {
    const v = values[i];
    const isBest = i === bestIdx;
    const pct = max > 0 ? (v / max) * 100 : 0;
    const prev = Number(ref.valueEl.dataset.v ?? -1);

    ref.fill.style.width = pct + '%';
    if (v !== prev) {
      ref.valueEl.textContent = v;
      pulse(ref.valueEl);
    }
    ref.valueEl.dataset.v = v;
    ref.row.classList.toggle('best', isBest);
    ref.markEl.innerHTML = isBest ? '<span class="best-mark" aria-label="最高收益">▶</span>' : '';
    ref.emojiEl.textContent = isBest ? '😍 ' + (bestPct === Infinity ? '+∞' : '+' + bestPct + '%') : '😍';
    const op = operations[i];
    const equiv = (v / 10).toFixed(1);
    const meta = (op.id === 'urgent' || op.id === 'outpost')
      ? '≈ ' + equiv + ' （' + ((v / 10) + 1).toFixed(1) + '）收藏品'
      : '≈ ' + equiv + ' 收藏品';
    if (ref.metaEl.textContent !== meta) ref.metaEl.textContent = meta;
  });

  const shopNet = mats.corn * 3 - 4;
  const shopEl = document.getElementById('shopNet');
  const shopText = String(shopNet);
  if (shopEl.textContent !== shopText) {
    shopEl.textContent = shopText;
    pulse(shopEl);
  }
  shopEl.classList.toggle('neg', shopNet < 0);
}

function pulse(el) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

function applyStep(id, delta) {
  state[id] = Math.max(0, state[id] + delta);
  document.querySelector('.mat-row[data-id="' + id + '"] .qty-input').value = state[id];
  saveState();
  render();
}

function wireInputs() {
  const list = document.getElementById('matList');
  list.querySelectorAll('.qty-btn').forEach(btn => {
    const id = btn.closest('.mat-row').dataset.id;
    const delta = btn.dataset.act === 'plus' ? 1 : -1;
    let holdTimer = null;
    let repeatTimer = null;
    let repeatActive = false;
    const startHold = () => {
      holdTimer = setTimeout(() => {
        repeatActive = true;
        applyStep(id, delta);
        repeatTimer = setInterval(() => applyStep(id, delta), 1000);
      }, 2000);
    };
    const stopHold = () => {
      clearTimeout(holdTimer);
      if (repeatTimer) clearInterval(repeatTimer);
      holdTimer = null; repeatTimer = null;
      setTimeout(() => { repeatActive = false; }, 250);
    };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) { }
      startHold();
    });
    btn.addEventListener('pointerup', stopHold);
    btn.addEventListener('pointercancel', stopHold);
    btn.addEventListener('pointerleave', stopHold);
    let lastClickAt = -1000;
    btn.addEventListener('click', () => {
      if (repeatActive) { repeatActive = false; return; }
      const now = Date.now();
      if (now - lastClickAt < 120) return;
      lastClickAt = now;
      applyStep(id, delta);
    });
  });

  list.querySelectorAll('.qty-input').forEach(input => {
    const row = input.closest('.mat-row');
    const id = row.dataset.id;
    input.addEventListener('focus', () => { requestAnimationFrame(() => input.select()); });
    input.addEventListener('input', () => {
      const raw = input.value;
      if (raw === '') { state[id] = 0; }
      else if (!Number.isFinite(Number(raw)) || Number(raw) < 0 || !Number.isInteger(Number(raw))) {
        const fixed = sanitize(raw);
        state[id] = fixed;
        input.value = String(fixed);
      } else {
        state[id] = Number(raw);
      }
      saveState();
      render();
    });
    input.addEventListener('blur', () => {
      if (input.value === '') {
        input.value = '0'; state[id] = 0; saveState(); render();
      }
    });
  });

  const resetMaterials = () => {
    for (const m of materials) state[m.id] = 0;
    document.querySelectorAll('.mat-row').forEach(row => {
      row.querySelector('.qty-input').value = '0';
    });
    saveState();
    render();
  };
  document.getElementById('resetBtn').addEventListener('click', resetMaterials);
  const endingReset = document.getElementById('endingResetBtn');
  if (endingReset) endingReset.addEventListener('click', resetEndings);
}

const encState = {};
let currentEncFloor = 2;
const encFloorNames = ['第二层', '第三层', '第四层', '第五层', '第六层'];

function loadEncState() {
  try {
    const raw = localStorage.getItem(ENCOUNTERS_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(k => { if (typeof obj[k] === 'boolean') encState[k] = obj[k]; });
    }
  } catch (e) { }
}
function saveEncState() {
  try { localStorage.setItem(ENCOUNTERS_KEY, JSON.stringify(encState)); } catch (e) { }
}

function buildEncFloors() {
  const container = document.getElementById('encFloors');
  container.innerHTML = encFloorNames.map((name, i) => {
    const f = i + 2;
    return `<button type="button" class="enc-floor-btn ${f === currentEncFloor ? 'active' : ''}" data-floor="${f}">${name}</button>`;
  }).join('');

  container.addEventListener('click', (e) => {
    const btn = e.target.closest('.enc-floor-btn');
    if (!btn) return;
    currentEncFloor = parseInt(btn.dataset.floor, 10);
    container.querySelectorAll('.enc-floor-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.floor, 10) === currentEncFloor);
    });
    updateEncGridHighlights();
  });
}

function buildEncGrid() {
  const grid = document.getElementById('encGrid');
  grid.innerHTML = encounters.map(enc => `
    <label class="enc-item ${encState[enc.name] ? 'checked' : ''}" data-name="${enc.name}">
      <input type="checkbox" class="enc-check" ${encState[enc.name] ? 'checked' : ''}>
      <span class="enc-name">${enc.name}</span>
    </label>
  `).join('');

  grid.addEventListener('change', (e) => {
    if (!e.target.classList.contains('enc-check')) return;
    const label = e.target.closest('.enc-item');
    const name = label.dataset.name;
    encState[name] = e.target.checked;
    
    // 动态切换 checked 类以触发变红
    if (e.target.checked) {
      label.classList.add('checked');
    } else {
      label.classList.remove('checked');
    }
    
    saveEncState();
    updateEncCount();
  });

  updateEncGridHighlights();
}

function updateEncGridHighlights() {
  document.querySelectorAll('.enc-item').forEach(item => {
    const name = item.dataset.name;
    const enc = encounters.find(e => e.name === name);
    if (enc && enc.floors.includes(currentEncFloor)) {
      item.classList.add('available');
    } else {
      item.classList.remove('available');
    }
  });
}

function updateEncCount() {
  const count = Object.values(encState).filter(v => v).length;
  document.getElementById('encCount').innerHTML = `已勾选：<b>${count}</b>`;
}

function wireEncPanel() {
  const panel = document.getElementById('encPanel');
  const head = document.getElementById('encHead');
  const body = document.getElementById('encBody');
  
  head.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    head.setAttribute('aria-expanded', String(open));
    body.style.maxHeight = open ? (body.scrollHeight + 'px') : '0px';
  });

  window.addEventListener('resize', () => {
    if (panel.classList.contains('open')) {
      body.style.maxHeight = body.scrollHeight + 'px';
    }
  });

  document.getElementById('encResetBtn').addEventListener('click', () => {
    Object.keys(encState).forEach(k => encState[k] = false);
    saveEncState();
    document.querySelectorAll('.enc-check').forEach(cb => cb.checked = false);
    document.querySelectorAll('.enc-item').forEach(item => item.classList.remove('checked'));
    updateEncCount();
  });
}

let records = [];
const endings = { sandboxAlpha: false, sandboxBeta: false, beacon: false };

function loadRecords() {
  try {
    const raw = localStorage.getItem(RECORDS_KEY);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    records = arr.map(r => ({
      desc: typeof r.desc === 'string' ? r.desc : '',
      num: Number.isInteger(Number(r.num)) && Number(r.num) >= 0 ? Number(r.num) : '',
      hasSandboxAlpha: !!r.hasSandboxAlpha,
      hasSandboxBeta: !!r.hasSandboxBeta,
      hasBeacon: !!r.hasBeacon
    }));
  } catch (e) { }
}
function saveRecords() { try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (e) { } }

function computeAvg() {
  let sum = 0, n = 0;
  for (const r of records) {
    if (r.num !== '' && Number.isInteger(r.num) && r.num >= 0) { sum += r.num; n++; }
  }
  return n > 0 ? sum / n : null;
}
function updateAvgDisplay() {
  const avg = computeAvg();
  document.getElementById('recordsAvg').textContent = avg === null ? '--' : avg.toFixed(1);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderRecords() {
  const list = document.getElementById('recordsList');
  const empty = document.getElementById('recordsEmpty');
  list.innerHTML = '';
  records.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'record-row';
    row.innerHTML = `
      <input type="text" class="record-desc" placeholder="对局说明" maxlength="60" value="${escapeHtml(r.desc)}" aria-label="对局说明">
      <input type="number" class="record-num" min="0" step="1" inputmode="numeric" placeholder="收藏品" value="${r.num}" aria-label="收藏品数量">
      <button type="button" class="record-del" aria-label="删除该对局">×</button>`;
    list.appendChild(row);
    const descIn = row.querySelector('.record-desc');
    const numIn = row.querySelector('.record-num');
    const delBtn = row.querySelector('.record-del');
    
    descIn.addEventListener('input', () => {
      records[i].desc = descIn.value;
      saveRecords();
      if (currentUser && supabaseClient) queueCloudUpdate(records[i]);
      else if (!descIn._hinted) { descIn._hinted = true; hintLocal(); }
    });
    numIn.addEventListener('input', () => {
      const raw = numIn.value;
      if (raw === '') { records[i].num = ''; }
      else if (!Number.isFinite(Number(raw)) || Number(raw) < 0 || !Number.isInteger(Number(raw))) {
        const fixed = Math.max(0, Math.floor(Number(raw)));
        records[i].num = fixed;
        numIn.value = String(fixed);
      } else { records[i].num = Number(raw); }
      saveRecords();
      updateAvgDisplay();
      updateChart();
      if (currentUser && supabaseClient) queueCloudUpdate(records[i]);
      else if (!numIn._hinted) { numIn._hinted = true; hintLocal(); }
    });
    delBtn.addEventListener('click', async () => {
      if (currentUser && supabaseClient && records[i].id) {
        const { error } = await supabaseClient.from('duiju_records').delete().eq('id', records[i].id);
        if (error) { showAuthMsg('云端删除失败：' + error.message, true); return; }
      } else if (!currentUser) { hintLocal(); }
      records.splice(i, 1);
      saveRecords();
      renderRecords();
    });
  });
  empty.classList.toggle('show', records.length === 0);
  updateAvgDisplay();
  updateChart();
  const panel = document.getElementById('recordsPanel');
  if (panel.classList.contains('open')) {
    const body = document.getElementById('recordsBody');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function wireRecords() {
  const panel = document.getElementById('recordsPanel');
  const head = document.getElementById('recordsHead');
  const body = document.getElementById('recordsBody');

  head.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    head.setAttribute('aria-expanded', String(open));
    body.style.maxHeight = open ? (body.scrollHeight + 'px') : '0px';
  });
  window.addEventListener('resize', () => {
    if (panel.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px';
  });

  document.getElementById('recordsAddBtn').addEventListener('click', async () => {
    const rec = { desc: '', num: '', hasSandboxAlpha: endings.sandboxAlpha, hasSandboxBeta: endings.sandboxBeta, hasBeacon: endings.beacon };
    if (currentUser && supabaseClient) {
      const row = await cloudInsert(rec);
      if (!row) return;
      rec.id = row.id;
    } else { hintLocal(); }
    records.push(rec);
    saveRecords();
    renderRecords();
    const rows = document.querySelectorAll('.record-row');

        btn.dataset.arm = '1'; btn.textContent = '再次点击确认清空';
        setTimeout(() => { btn.dataset.arm = ''; btn.textContent = '清空全部对局'; }, 3500);

    }
    if (!confirmed) return;
    if (currentUser && supabaseClient) {
      for (const r of records) { if (r.id) await supabaseClient.from('duiju_records').delete().eq('id', r.id); }
    }
    records = []; saveRecords(); renderRecords();

}

function loadEndings() {
  try {
    const raw = localStorage.getItem(ENDINGS_KEY);

    const obj = JSON.parse(raw);
    endings.sandboxAlpha = !!obj.sandboxAlpha;
    endings.sandboxBeta = !!obj.sandboxBeta;
    endings.beacon = !!obj.beacon;
  } catch (e) { }
}
function saveEndings() { try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(endings)); } catch (e) { } }
function syncEndingChecks() {
  const map = { endingAlpha: endings.sandboxAlpha, endingBeta: endings.sandboxBeta, endingBeacon: endings.beacon };
  for (const [id, v] of Object.entries(map)) {
    const el = document.getElementById(id);
    if (el) el.checked = !!v;
  }
}
function resetEndings() {
  endings.sandboxAlpha = false; endings.sandboxBeta = false; endings.beacon = false;
  try { localStorage.removeItem(ENDINGS_KEY); } catch (e) { }
  syncEndingChecks(); queueEndingSync();
}
let endingTimer = null;
async function syncEndingsToCloud() {
  if (!currentUser || !supabaseClient) return;
  const last = records[records.length - 1];
  if (!last || !last.id) return;
  last.hasSandboxAlpha = endings.sandboxAlpha;
  last.hasSandboxBeta = endings.sandboxBeta;
  last.hasBeacon = endings.beacon;
  await cloudUpdate(last);
}
function queueEndingSync() { clearTimeout(endingTimer); endingTimer = setTimeout(syncEndingsToCloud, 400); }
function wireEndings() {
  const pairs = [['endingAlpha', 'sandboxAlpha'], ['endingBeta', 'sandboxBeta'], ['endingBeacon', 'beacon']];
  pairs.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => {
      endings[key] = el.checked; saveEndings(); queueEndingSync();
    });
  });
}

let relicChart = null;
let chartMaxSet = new Set();
let chartAvgValue = null;

const avgLinePlugin = {
  id: 'avgLine',
  afterDatasetsDraw(chart) {
    const avg = chartAvgValue;
    if (!(avg > 0) || chart.data.datasets.length === 0) return;
    const y = chart.scales.y.getPixelForValue(avg);
    if (!Number.isFinite(y)) return;
    const { left, right } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = '#5B8DB8'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#5B8DB8'; ctx.font = '9px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('均藏 ' + avg.toFixed(1), right, y - 3);
    ctx.restore();
  }
};

function updateChart() {
  const canvas = document.getElementById('relicChart');
  const empty = document.getElementById('chartEmpty');
  if (!canvas || !empty) return;
  if (typeof Chart === 'undefined') {
    empty.textContent = '图表组件加载失败'; empty.style.display = 'flex'; return;
  }
  if (records.length === 0) {
    empty.textContent = '暂无数据，请添加对局'; empty.style.display = 'flex';
    if (relicChart) { relicChart.destroy(); relicChart = null; }
    return;
  }
  empty.style.display = 'none';
  const labels = records.map((_, i) => '第' + (i + 1) + '局');
  const data = records.map(r => (r.num !== '' && r.num != null ? r.num : null));
  
  chartMaxSet.clear();
  let maxV = -Infinity;
  data.forEach((v) => { if (v != null && v > maxV) maxV = v; });
  data.forEach((v, i) => { if (v != null && v === maxV) chartMaxSet.add(i); });
  
  const validVals = data.filter(v => v != null);
  chartAvgValue = validVals.length ? validVals.reduce((a, b) => a + b, 0) / validVals.length : null;
  
  if (relicChart) {
    relicChart.data.labels = labels;
    relicChart.data.datasets[0].data = data;
    relicChart.update();
    return;
  }
  relicChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels, datasets: [{
        label: '收藏品数量', data,
        borderColor: '#d4a017', backgroundColor: 'rgba(212, 160, 23, 0.12)',
        pointStyle: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? 'star' : 'circle'),
        pointRadius: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? 5 : 3),
        pointBackgroundColor: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? '#d4a017' : '#8b1a1a'),
        pointBorderColor: (ctx) => (chartMaxSet.has(ctx.dataIndex) ? '#d4a017' : '#d4a017'),
        borderWidth: 2, tension: 0.3, spanGaps: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#1a2a1a' }, ticks: { color: '#6a7a6a', font: { size: 10 } } },
        y: { beginAtZero: true, grid: { color: '#1a2a1a' }, ticks: { color: '#6a7a6a', font: { size: 10 }, precision: 0 } }
      }
    },
    plugins: [avgLinePlugin]
  });
}

function showAuthMsg(msg, isError) {

function hintLocal() {
  const el = document.getElementById('authStatus');

let cloudTimer = null;
function queueCloudUpdate(rec) {
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudUpdate(rec), 400);
}

async function loadCloudRecords() {
  if (!supabaseClient || !currentUser) return;
  const { data, error } = await supabaseClient.from('duiju_records').select('*');
  if (error) { showAuthMsg('云端读取失败：' + error.message, true); return; }
  const rows = data || [];
  if (rows.length && rows[0].created_at) {
    rows.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
  }
  records = rows.map(r => ({
    id: r.id,
    desc: typeof r.description === 'string' ? r.description : '',
    num: Number.isInteger(Number(r.relic_count)) && Number(r.relic_count) >= 0 ? Number(r.relic_count) : '',
    hasSandboxAlpha: !!r.has_sandbox_alpha,
    hasSandboxBeta: !!r.has_sandbox_beta,
    hasBeacon: !!r.has_beacon
  }));
  saveRecords();
  if (records.length) {
    const last = records[records.length - 1];
    endings.sandboxAlpha = !!last.hasSandboxAlpha;
    endings.sandboxBeta = !!last.hasSandboxBeta;
    endings.beacon = !!last.hasBeacon;
    saveEndings(); syncEndingChecks();
  }
}

async function cloudInsert(rec) {
  const { data, error } = await supabaseClient.from('duiju_records').insert({
    user_id: currentUser.id,
    description: rec.desc,
    relic_count: rec.num === '' ? null : Number(rec.num),
    has_sandbox_alpha: !!rec.hasSandboxAlpha,
    has_sandbox_beta: !!rec.hasSandboxBeta,
    has_beacon: !!rec.hasBeacon
  }).select();
  if (error) { showAuthMsg('云端添加失败：' + error.message, true); return null; }
  return data && data[0] ? data[0] : null;
}
async function cloudUpdate(rec) {
  if (!rec.id) return;
  const { error } = await supabaseClient.from('duiju_records').update({
    description: rec.desc,
    relic_count: rec.num === '' ? null : Number(rec.num),
    has_sandbox_alpha: !!rec.hasSandboxAlpha,
    has_sandbox_beta: !!rec.hasSandboxBeta,
    has_beacon: !!rec.hasBeacon
  }).eq('id', rec.id);
  if (error) showAuthMsg('云端同步失败：' + error.message, true);
}

  if (!supabaseClient) { showAuthMsg('云端服务未加载', true); return; }
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!email || !pass) { showAuthMsg('请输入邮箱和密码', true); return; }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
  if (error) { showAuthMsg(error.message, true); return; }
  currentUser = data.user; renderAuth(); await loadCloudRecords(); renderRecords();
  showAuthMsg('已登录，数据同步云端', false);
}
async function authRegister() {
  if (!supabaseClient) { showAuthMsg('云端服务未加载', true); return; }
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!email || !pass) { showAuthMsg('请输入邮箱和密码', true); return; }

  } else {
    currentUser = data.user; renderAuth(); await loadCloudRecords(); renderRecords();
    showAuthMsg('已登录，数据同步云端', false);
  }
}
async function authLogout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  loadRecords(); loadEndings(); syncEndingChecks(); renderAuth(); renderRecords();
}

function renderAuth() {
  const box = document.getElementById('authBox');
  if (!box) return;
  if (currentUser) {
    box.innerHTML = `
      <span class="auth-user">已登录：${escapeHtml(currentUser.email || '')}</span>
      <button type="button" class="auth-btn" id="authLogoutBtn">退出登录</button>
      <span class="auth-status ok" id="authStatus">已同步云端</span>`;
    document.getElementById('authLogoutBtn').addEventListener('click', authLogout);
  } else {
    box.innerHTML = `
      <input type="email" class="auth-input" id="authEmail" placeholder="邮箱" autocomplete="email">
      <input type="password" class="auth-input" id="authPass" placeholder="密码" autocomplete="current-password">
      <button type="button" class="auth-btn" id="authLoginBtn">登录</button>
      <button type="button" class="auth-btn" id="authRegisterBtn">注册</button>
      <span class="auth-status" id="authStatus">未登录 · 数据仅存本机</span>`;
    document.getElementById('authLoginBtn').addEventListener('click', authLogin);
    document.getElementById('authRegisterBtn').addEventListener('click', authRegister);
  }
}

async function initAuth() {
  renderAuth();
  if (!supabaseClient) return;
  try {
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    renderAuth();
    if (currentUser) { await loadCloudRecords(); renderRecords(); }
  } catch (e) { }
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    currentUser = session ? session.user : null;
    renderAuth();
    if (currentUser) { loadCloudRecords().then(renderRecords); }
    else { loadRecords(); renderRecords(); }
  });
}
